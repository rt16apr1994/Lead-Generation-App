name: Daily Lead Generation

on:
  schedule:
    - cron: '0 4 * * *' # Daily morning 9:30 AM IST (approx)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important for saving history
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install apify-client pandas openpyxl

      - name: Run Lead Script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python lead_script.py

      - name: Save History
        run: |
          git config --global user.name "LeadBot"
          git config --global user.email "bot@github.com"
          
          # Agar script ne file nahi banayi, toh khali file create karo (Error rokne ke liye)
          if [ ! -f leads_history.csv ]; then
            echo "placeId,title,date" > leads_history.csv
          fi
          
          git add leads_history.csv
          
          # Sirf tab commit karein jab file mein naya data ho
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update leads history [skip ci]" && git push)
